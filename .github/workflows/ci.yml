name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Docker Engine 29 rejects API versions below 1.40; tell docker-java (used by
      # Testcontainers) to speak a current one.
      - name: Docker API version for Testcontainers
        run: echo "api.version=1.44" > ~/.docker-java.properties
      - name: Unit + integration tests (Testcontainers PostgreSQL 16)
        run: mvn -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose config -q
      - name: Images build
        run: docker compose build api web
